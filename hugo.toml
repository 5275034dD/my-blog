baseURL = 'https://37624682.xyz/'
languageCode = 'zh-cn'
title = '纳斯达克每日简报'
theme = 'PaperMod'

# 开启 JSON 索引输出，供 Fuse.js 毫秒级全站搜索使用
[outputs]
  home = ["HTML", "RSS", "JSON"]

# 顶部导航菜单设置
[[menu.main]]
  name = "🔍 搜索"
  url = "search/"
  weight = 10

[[menu.main]]
  name = "🏷️ 标签"
  url = "tags/"
  weight = 20

# 主题功能扩展
[params]
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
