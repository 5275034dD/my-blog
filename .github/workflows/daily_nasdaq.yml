    "QQQ": "QQQ",        # 纳斯达克100 ETF
    "VIX": "^VIX",       # 恐慌指数
    "TNX": "^TNX",       # 10年期美债收益率
    "NVDA": "NVDA",      # 英伟达
    "AAPL": "AAPL",      # 苹果
    "MSFT": "MSFT",      # 微软
    "GOOGL": "GOOGL",    # 谷歌
