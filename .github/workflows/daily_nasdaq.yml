name: Daily Nasdaq Auto Post

on:
  schedule:
    - cron: '30 21 * * *' # 每天北京时间 05:30 自动运行
  workflow_dispatch: # 支持网页端手动点击触发运行

jobs:
  auto-gen-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖包
        run: pip install google-genai

      - name: 运行抓取与 AI 分析脚本
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/daily_nasdaq.py

      - name: 自动提交更新至仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts/
          git diff-index --quiet HEAD || (git commit -m "auto: 更新纳斯达克每日简报与 AI 点评" && git push)
