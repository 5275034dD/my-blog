name: Daily Nasdaq Auto Post

on:
  schedule:
    # 每天北京时间 05:30 自动触发 (对应 UTC 时间 21:30)
    - cron: '30 21 * * *'
  workflow_dispatch: # 支持网页点按钮手动触发

jobs:
  auto-gen-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 运行抓取脚本
        run: python scripts/daily_nasdaq.py

      - name: 自动提交到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts/
          git diff-index --quiet HEAD || (git commit -m "auto: 更新纳斯达克每日简报" && git push)
