name: Daily Nasdaq Auto Post

on:
  schedule:
    # 北京时间 周二至周六 07:00 自动运行（对应 UTC 时间 周一至周五 23:00）
    - cron: '15 23 * * 1-5'
  workflow_dispatch: # 支持在 GitHub 网页端手动点击运行

jobs:
  auto-gen-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖包
        run: pip install google-genai

      - name: 运行抓取与 AI 分析脚本
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/daily_nasdaq.py

      - name: 自动提交更新至仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts/
          git diff-index --quiet HEAD || (git commit -m "auto: 更新纳斯达克每日简报与 AI 点评" && git push)
